<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>cipher keel — Harness</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: #0d0d0d;
        color: #e0e0e0;
        font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace;
        font-size: 13px;
        overflow: hidden;
        user-select: none;
      }

      #app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
      }

      /* The settings tabs scroll; inputs need selectable text. */
      input,
      select,
      textarea {
        user-select: text;
        font-family: inherit;
      }

      /* The event list scrolls and its text must be selectable — a prompt is evidence. */
      pre,
      code {
        user-select: text;
        white-space: pre-wrap;
        word-break: break-word;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./harness-window.tsx"></script>
  </body>
</html>
