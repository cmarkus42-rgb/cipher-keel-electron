name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the running job.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # macOS is required, not a convenience: tmux, Unix domain sockets and the
    # Keychain are macOS-bound (see "Out of scope" in the completion roadmap).
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # .nvmrc pins Node 24 (Active LTS, npm 11). The major of npm matters more
          # here than the major of Node: npm 11 and npm 10 hoist nested dependencies
          # differently, so a lockfile written by one can be rejected by the other.
          # That is exactly what happened — CI sat red from the packaging work until
          # 2026-08-12 with "Missing: esbuild@0.28.2 from lock file", because the
          # lockfile was regenerated on a workstation running npm 11 while this
          # pinned Node 22 with npm 10. Keep this in step with the machines that
          # write the lockfile, and prefer an LTS line: Node 25 would have matched
          # the workstation exactly and has been end-of-life since 2026-06-01.
          node-version-file: '.nvmrc'
          # The compute part of the pipeline takes about ten seconds; runtime
          # is decided by the download. Without this cache every run would be costly.
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Typecheck
        # Its own gate, not part of `test`: vitest transforms TypeScript via
        # esbuild and does not check types while doing so. An IPC channel in
        # the wrong union would not make the test suite red — only tsc catches that.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        # Catches breakage in the electron-vite configuration that no unit test covers.
        run: npm run build

      - name: Verify bundle
        # Asserts the inlined markdown (entity bodies, personas, capability SKILL.md)
        # survived rollup into dist/main/index.js. A regression back to
        # fs.readFileSync would keep every unit test green (vitest reads from disk)
        # and only break in the packaged app, where the source tree does not exist.
        run: npm run verify:bundle
